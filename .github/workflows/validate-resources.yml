name: Validate resources
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claudespace-validate-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - name: Unit and protocol tests
        run: PYTHONPATH=scripts python -B -m unittest discover -s tests -v
      - name: Validate pinned resource bodies
        run: python scripts/validate_catalogs.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/resource-validation" --fetch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resource-validation
          path: ${{ runner.temp }}/resource-validation/*.json
          retention-days: 30
          if-no-files-found: warn
