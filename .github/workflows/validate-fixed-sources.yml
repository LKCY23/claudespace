name: Validate fixed sources
on:
  push:
    branches: [main, codex/claude-codex-adaptation]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Optional exact source commit to inspect as data; blank validates this trusted ref'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: claudespace-fixed-sources-${{ inputs.commit || github.sha }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    name: Fixed source validation
    if: github.repository == 'LKCY23/claudespace' && (github.ref_name == github.event.repository.default_branch || github.ref_name == vars.CLAUDESPACE_PRIVATE_CI_PREVIEW_REF)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: claudespace-private-sources
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check the requested source identity
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          value = os.environ['REQUESTED_COMMIT']
          if value and not re.fullmatch(r'[0-9a-f]{40}', value):
              raise SystemExit('Supply an exact 40-character commit SHA')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: validator
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Record the inspected commit
        id: target
        run: |
          source_commit=$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
      - name: Validate source data with trusted code
        id: validation
        env:
          CLAUDESPACE_GOAL_AUTHORING_KEY: ${{ secrets.CLAUDESPACE_GOAL_AUTHORING_KEY }}
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/validator/scripts/private_ci.py" validate --root "$GITHUB_WORKSPACE/candidate" --report "$RUNNER_TEMP/fixed-source-validation.json"
      - name: Record status on the inspected commit
        if: always() && steps.target.outputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.target.outputs.commit }}
          CHECK_STATE: ${{ steps.validation.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_COMMIT" \
            -f state="$CHECK_STATE" -f context='claudespace/fixed-sources' \
            -f description='Fixed-source structural validation; native runtime not tested' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fixed-source-validation-${{ steps.target.outputs.commit }}
          path: ${{ runner.temp }}/fixed-source-validation.json
          retention-days: 30
          if-no-files-found: warn
